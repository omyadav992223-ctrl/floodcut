[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "floodcut"
version = "0.6.0"
description = "FloodCut: Mumbai flood-risk and drainage-repair prioritization using Discrete Mathematics (Phase 6 frontend)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
ui = [
    "streamlit>=1.30.0",
    "folium>=0.15.0",
    "streamlit-folium>=0.17.0",
    "matplotlib>=3.7.0",
    "pandas>=1.5.0",
]

[project.scripts]
floodcut = "floodcut.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
